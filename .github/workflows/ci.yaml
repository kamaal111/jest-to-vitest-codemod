name: CI

on:
  push:

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      - run: just bootstrap-ci

      - run: just quality

  test:
    name: Test (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    env:
      CLI_ENTRY: ${{ matrix.cli_entry }}
    steps:
      - uses: actions/checkout@v6

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      - run: just bootstrap-ci

      - name: Build
        if: matrix.cli_entry == 'dist'
        run: just build-clean

      - run: ${{ matrix.cli_entry == 'dist' && 'just test' || 'just test-cov' }}

  example:
    name: Example App Transformation (${{ matrix.cli_entry }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cli_entry: [src, dist]
    env:
      CLI_ENTRY: ${{ matrix.cli_entry }}
    steps:
      - uses: actions/checkout@v6

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(jq -r '.devEngines.packageManager.version' package.json)" >> "$GITHUB_OUTPUT"

      - uses: extractions/setup-just@v3

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'

      - run: just bootstrap-ci

      - name: Build
        if: matrix.cli_entry == 'dist'
        run: just build-clean

      - run: just example-transform-check

      - name: Verify the example was actually transformed
        run: |
          just transform-example
          if ! grep -rqE "from ['\"]vitest['\"]" example/tests; then
            echo "::error::example/tests does not import vitest after transformation"
            exit 1
          fi
          if grep -rqE "(^|[^'\"\`[:alnum:]_$])jest\.|from ['\"]@jest/globals['\"]" example/tests; then
            echo "::error::example/tests still references jest after transformation"
            exit 1
          fi
